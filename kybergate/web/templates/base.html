<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kybergate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Cpath d='M9 8v16M9 16l9-8M9 16l9 8M21 12h4M21 20h4' stroke='%2323577a' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="bar">
    <div class="bar-inner">
      <a class="logo" href="/">kybergate</a>
      <span class="sub">ML-KEM-768 · FIPS 203</span>
      {% block bar %}{% endblock %}
    </div>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="foot">
    <div class="foot-inner">
      Server: official CRYSTALS-Kyber reference code ({{ upstream }}).
      Browser: <a href="https://github.com/paulmillr/noble-post-quantum">@noble/post-quantum</a>.
    </div>
  </footer>
  <script src="{{ url_for('static', path='vendor/mlkem.js') }}"></script>
  <script src="{{ url_for('static', path='js/kyber-client.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
